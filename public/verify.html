<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{font-family:sans-serif;text-align:center;padding:40px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}</style>
</head><body>
<h2 id="t">🔐 Verifying device...</h2>
<script>
(async () => {
  const tg = Telegram.WebApp; tg.ready();
  const c = document.createElement('canvas').getContext('2d');
  c.textBaseline = 'top'; c.font = '14px Arial'; c.fillText('earnix-fp', 2, 2);
  const raw = [navigator.userAgent, navigator.language, screen.width + 'x' + screen.height, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.hardwareConcurrency, c.canvas.toDataURL()].join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  const fp = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  try {
    const r = await fetch('/.netlify/functions/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ initData: tg.initData, fp }) });
    document.getElementById('t').textContent = r.ok ? '✅ Verified' : '❌ Failed';
    if (r.ok) setTimeout(() => tg.close(), 800);
  } catch (e) { document.getElementById('t').textContent = '❌ Error'; }
})();
</script></body></html>
