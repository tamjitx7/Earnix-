<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui,sans-serif;text-align:center;padding:56px 20px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}
.sp{width:44px;height:44px;border:4px solid #8884;border-top-color:var(--tg-theme-button-color,#2481cc);border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.i{font-size:56px;margin-bottom:8px}
p{opacity:.7}
</style></head>
<body>
<div class="sp" id="sp"></div><div class="i" id="ic"></div>
<h2 id="t"></h2><p id="m"></p>
<script>
const TX = {
  en: { w: 'Verifying your device...', ok: 'Device verified', bad: 'Verification failed', dev: 'This device is already linked to another account.', err: 'Something went wrong. Please try again.' },
  ar: { w: 'جارٍ التحقق من جهازك...', ok: 'تم التحقق من الجهاز', bad: 'فشل التحقق', dev: 'هذا الجهاز مرتبط بحساب آخر.', err: 'حدث خطأ. حاول مرة أخرى.' },
  ru: { w: 'Проверяем ваше устройство...', ok: 'Устройство подтверждено', bad: 'Проверка не пройдена', dev: 'Это устройство уже привязано к другому аккаунту.', err: 'Что-то пошло не так. Попробуйте ещё раз.' }
};
(async () => {
  const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
  const L = TX[new URLSearchParams(location.search).get('lang')] || TX.en;
  const $ = (id) => document.getElementById(id);
  const done = (icon, title, msg) => { $('sp').style.display = 'none'; $('ic').textContent = icon; $('t').textContent = title; $('m').textContent = msg || ''; };
  $('t').textContent = L.w;
  try {
    const sha = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, '0')).join('');

    // device token: app storage + cookie e rakha random ID
    let token = null;
    try { token = localStorage.getItem('ex_dt'); } catch (e) {}
    if (!token) { const m = document.cookie.match(/(?:^|; )ex_dt=([^;]+)/); if (m) token = m[1]; }
    if (!token) token = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, '');
    try { localStorage.setItem('ex_dt', token); } catch (e) {}
    document.cookie = 'ex_dt=' + token + ';max-age=315360000;path=/;SameSite=None;Secure';

    // fingerprint
    const cv = document.createElement('canvas'); cv.width = 240; cv.height = 60;
    const cx = cv.getContext('2d'); cx.textBaseline = 'top'; cx.font = '16px Arial';
    cx.fillStyle = '#f60'; cx.fillRect(10, 5, 100, 30); cx.fillStyle = '#069'; cx.fillText('Earnix fp 😀 ✓', 4, 8);
    let gl = 'na';
    try {
      const g = document.createElement('canvas').getContext('webgl');
      const e = g.getExtension('WEBGL_debug_renderer_info');
      if (e) gl = g.getParameter(e.UNMASKED_VENDOR_WEBGL) + '|' + g.getParameter(e.UNMASKED_RENDERER_WEBGL);
    } catch (e) {}
    const info = {
      ua: navigator.userAgent.slice(0, 140), plat: tg.platform, ver: tg.version,
      scr: screen.width + 'x' + screen.height + 'x' + screen.colorDepth + '@' + devicePixelRatio,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone, off: new Date().getTimezoneOffset(),
      lang: navigator.language, hc: navigator.hardwareConcurrency, mem: navigator.deviceMemory, tp: navigator.maxTouchPoints, gl
    };
    const fp = await sha(JSON.stringify([info, cv.toDataURL()]));

    const r = await fetch('/.netlify/functions/verify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, fp, token, info })
    });
    if (r.ok) { done('✅', L.ok); setTimeout(() => tg.close(), 900); }
    else if (r.status === 409) done('🚫', L.bad, L.dev);
    else done('⚠️', L.bad, L.err);
  } catch (e) { done('⚠️', L.bad, L.err); }
})();
</script></body></html>
